<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyber AI animated header">
  <!-- ===== DEFINITIONS ===== -->
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FB9B1"/>
      <stop offset="100%" stop-color="#F4B41A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="320" fill="#0B0E14"/>

  <!-- ===== ANIMATED LINES ===== -->
  <g stroke="url(#cyberGradient)" stroke-width="2" fill="none" filter="url(#softGlow)" opacity="0.85">
    <path d="M-200 80 H1400">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M-400 160 H1200">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="18s" repeatCount="indefinite" />
    </path>
    <path d="M-300 240 H1500">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="250 0" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ===== NODES ===== -->
  <g fill="#F4B41A" opacity="0.9">
    <circle cx="300" cy="80" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Extra particles -->
    <circle cx="500" cy="50" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="120" r="3.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ===== ANIMATED NAME ===== -->
  <text x="50" y="150" font-size="60" font-family="Arial" fill="none" stroke="url(#cyberGradient)" stroke-width="2" 
        stroke-dasharray="400" stroke-dashoffset="400">
    Full stack web Developer
    <animate attributeName="stroke-dashoffset" from="400" to="0" dur="3s" fill="freeze" />
  </text>

  <!-- ===== TEXTE SECONDARY ===== -->
  <text x="50" y="200" font-size="24" font-family="Arial" fill="url(#cyberGradient)" font-style="italic">
    Cybersecurity and AI-Oriented Engineer
  </text>

  <!-- ===== LOGO (2D/3D) ===== -->
  <polygon points="1100,50 1150,150 1050,150" fill="url(#cyberGradient)" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 1100 100" to="360 1100 100" dur="10s" repeatCount="indefinite"/>
  </polygon>
</svg>
