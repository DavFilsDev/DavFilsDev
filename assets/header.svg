<svg
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Cyber AI animated header">

  <!-- ===== DEFINITIONS ===== -->
  <defs>
    <!-- Linear Gradient: Teal -> Amber -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FB9B1"/>
      <stop offset="100%" stop-color="#F4B41A"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="320" fill="#0B0E14"/>

  <!-- ===== ANIMATED LINES (DATA FLOW) ===== -->
  <g stroke="url(#cyberGradient)"
     stroke-width="2"
     fill="none"
     filter="url(#softGlow)"
     opacity="0.85">

    <path d="M-200 80 H1400">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="200 0"
        dur="12s"
        repeatCount="indefinite" />
    </path>

    <path d="M-400 160 H1200">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="300 0"
        dur="18s"
        repeatCount="indefinite" />
    </path>

    <path d="M-300 240 H1500">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="250 0"
        dur="15s"
        repeatCount="indefinite" />
    </path>
  </g>

  <!-- ===== NODES (INTELLIGENCE POINTS) ===== -->
  <g fill="#F4B41A" opacity="0.9">
    <circle cx="300" cy="80" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
