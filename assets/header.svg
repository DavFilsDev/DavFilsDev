<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyber AI animated header">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FB9B1"/>
      <stop offset="100%" stop-color="#F4B41A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0B0E14"/>

  <g stroke="url(#cyberGradient)" stroke-width="2" fill="none" filter="url(#softGlow)" opacity="0.85">
    <path d="M-200 80 H1400">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M-400 160 H1200">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="18s" repeatCount="indefinite" />
    </path>
    <path d="M-300 240 H1500">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="250 0" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <g fill="#F4B41A" opacity="0.9">
    <circle cx="300" cy="80" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="160" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="50" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="120" r="3.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <g id="neural-network" stroke="url(#cyberGradient)" stroke-width="1.2" fill="none" filter="url(#softGlow)" opacity="0.8">
    
    <circle cx="100" cy="50" r="3" fill="#F4B41A">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 5;0 0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="80" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 3;0 0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="120" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -4;0 0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="50" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -3;0 0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="100" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 -5;0 0" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="70" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 6;0 0" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>


  <circle cx="150" cy="200" r="3" fill="#F4B41A">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 5;0 0" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="220" r="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;-5 4;0 0" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="180" r="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="23s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="250" r="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 5;0 0" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="210" r="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;5 -4;0 0" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="240" r="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 6;0 0" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5.1s" repeatCount="indefinite"/>
  </circle>

    <circle cx="200" cy="150" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -3;0 0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 4;0 0" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="180" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 2;0 0" dur="27s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="150" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 -4;0 0" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="200" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="120" r="2.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 2;0 0" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="50" y="150" font-size="50" font-family="Arial" fill="none" stroke="url(#cyberGradient)" stroke-width="2" 
        stroke-dasharray="400" stroke-dashoffset="400">
   Full Stack Web / Mobile Developer
    <animate attributeName="stroke-dashoffset" from="400" to="0" dur="3s" fill="freeze" />
  </text>

  <text x="50" y="200" font-size="24" font-family="Arial" fill="url(#cyberGradient)" font-style="italic">
    Artificial Intelligence / Machine Learning-Oriented Engineer
  </text>

<g filter="url(#softGlow)">
  <animateTransform attributeName="transform" type="rotate" from="0 1100 100" to="360 1100 100" dur="10s" repeatCount="indefinite"/>
  <polygon points="1100,50 1150,75 1100,100 1050,75" fill="#F4B41A" opacity="0.95"/>
  <polygon points="1050,75 1100,100 1100,150 1050,125" fill="#000000" opacity="0.85"/>
  <polygon points="1100,100 1150,75 1150,125 1100,150" fill="#0FB9B1" opacity="0.6"/>
</g>
</svg>
